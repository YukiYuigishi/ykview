name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Test Windows client paths and transfer
        run: mise exec -- go test ./... -run '^TestWindows' -count=1

      - name: Test Windows server build
        run: mise exec -- go test -tags server_windows ./... -run '^TestWindows' -count=1

      - name: Build Windows CLI
        run: mise exec -- go build ./...

      - name: Build Windows-server-only CLI
        run: mise exec -- go build -tags server_windows ./...

  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
      MISE_ENV: analysis

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.mod', 'go.sum', 'mise.toml', 'mise.analysis.toml') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Verify generated helper artifacts are committed
        run: git diff --exit-code -- internal/preview/remote_helpers

      - name: Test
        run: mise exec -- go test ./...

      - name: Test with race detector
        run: mise exec -- go test -race ./...

      - name: Vet
        run: mise exec -- go vet ./...

      - name: Build
        run: mise exec -- go build ./...

      - name: Test server OS selection
        run: |
          mise exec -- go test -tags server_linux ./...
          mise exec -- go test -tags server_darwin ./...
          mise exec -- go test -tags server_windows ./...
          mise exec -- make build SERVER_OS=linux
          mise exec -- make build SERVER_OS=darwin
          mise exec -- make build SERVER_OS=windows

      - name: Dead-code analysis
        run: mise exec -- deadcode ./...

      - name: Staticcheck
        run: mise exec -- staticcheck -tests=false ./...
